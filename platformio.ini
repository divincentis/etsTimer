[platformio]
default_envs = esp32dev

; ── Firmware ────────────────────────────────────────────────────────────────
[env:esp32dev]
platform = espressif32 @ ^6.10.0      ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino

lib_deps =
    adafruit/RTClib @ ^2.1.4
    bblanchon/ArduinoJson @ ^7.3.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.3.2

; No filesystem needed any more, so give the two OTA app slots the space
; (1.875 MB each). NVS — where settings live — is at the same offset as the
; default table.
board_build.partitions = min_spiffs.csv

; Web UI is compiled into the firmware — no separate filesystem upload.
board_build.embed_txtfiles =
    data/www/index.html
    data/www/admin/schedule.html

; Root CAs so the heartbeat can verify HTTPS servers (tools/update_ca_bundle.sh).
board_build.embed_files =
    data/cert/x509_crt_bundle

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

; Over-the-air: upload .pio/build/esp32dev/firmware.bin from the admin page.

; ── Host unit tests:  pio test -e native ────────────────────────────────────
[env:native]
platform = native
test_framework = doctest
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
build_flags =
    -std=gnu++17
    -Wall -Wextra
